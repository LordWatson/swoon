# Swoon smoke test — the critical path, as far as it exists.
#
# Run:   maestro test maestro/smoke.yaml
# Needs: a dev build installed on a booted emulator or device, plus an API the
#        device can actually reach — a phone cannot resolve a .test domain
#        (docs/DEV_TOOLING.md § 4). Maestro needs a JVM.
#
# Today this asserts only what Phase 0 built: the app launches, the theme
# renders, and the device can reach the API. The TODOs below are the real
# critical path from docs/ARCHITECTURE.md § 9 — sign up, invite, accept, plan a
# date — each filled in by the phase named against it. Keep them in this order:
# every step depends on the one above it.
appId: test.swoon.app
---
- launchApp:
    clearState: true

# Phase 0 — the app boots and is themed.
- assertVisible: 'Swoon'
- assertVisible:
    id: 'health-card'

# Phase 0 — the device can reach the API. This is the step that catches a
# misconfigured EXPO_PUBLIC_API_URL, which is the usual reason a fresh clone
# looks broken on a phone.
- assertVisible: 'Connected to .*'

