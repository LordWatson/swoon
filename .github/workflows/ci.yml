name: CI

on:
  push:
    # This repo's default branch is master. Listing both so a later rename
    # cannot silently switch every gate off again.
    branches: [master, main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # API — style, static analysis, tests (SQLite in-memory: fast, no services)
  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: API (Pint · Larastan · Pest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan level 6)
        working-directory: api
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        working-directory: api
        run: ./vendor/bin/pest --no-coverage

  # ───────────────────────────────────────────────────────────────────────────
  # API — the same suite against MySQL 8.
  #
  # Production and dev are MySQL; the default suite runs on SQLite so a fresh
  # clone needs no setup. This job is what catches engine-specific breakage:
  # JSON columns, fulltext, collation, strict mode. See DECISIONS.md ADR-008.
  # It is the authoritative run for anything touching schema.
  # ───────────────────────────────────────────────────────────────────────────
  test-mysql:
    name: API tests on MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swoon_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests against MySQL 8
        working-directory: api
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: swoon_test
          DB_USERNAME: root
          DB_PASSWORD: root
          # No test may reach a real provider.
          AI_DRIVER: fake
        run: ./vendor/bin/pest --no-coverage

  # ───────────────────────────────────────────────────────────────────────────
  # Mobile — types, lint, format, tests.
  #
  # The Jest run includes the WCAG contrast gate, so a palette change that
  # breaks AA fails the build (docs/BRAND.md § 3.4).
  # ───────────────────────────────────────────────────────────────────────────
  mobile:
    name: Mobile (tsc · ESLint · Prettier · Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Format check
        working-directory: mobile
        run: npm run format:check

      - name: Tests (includes the WCAG contrast gate)
        working-directory: mobile
        run: npm test -- --ci

  # ───────────────────────────────────────────────────────────────────────────
  # Docs — the module.md rule, enforced for real on CI.
  #
  # The Claude Stop hook is a reminder that cannot block. This is the gate.
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    name: Module docs in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every changed module updated its module.md
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          missing=""

          check() {
            prefix="$1"
            mods=$(printf '%s\n' "$changed" \
              | grep -E "^${prefix}/[^/]+/" \
              | grep -v -E "^${prefix}/[^/]+/module\.md$" \
              | sed -E "s#^${prefix}/([^/]+)/.*#\1#" | sort -u)
            for m in $mods; do
              if ! printf '%s\n' "$changed" | grep -qx "${prefix}/${m}/module.md"; then
                missing="${missing}  - ${prefix}/${m}/module.md"$'\n'
              fi
            done
          }

          check "api/app/Modules"
          check "mobile/src/features"

          if [ -n "$missing" ]; then
            echo "::error::Module code changed without updating module.md:"
            printf '%s\n' "$missing"
            echo "Documentation is part of the definition of done (CLAUDE.md)."
            exit 1
          fi

          echo "All changed modules updated their module.md ✓"
